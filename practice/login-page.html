<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Bootstrap css link  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- javascript -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div
      class="row container-fluid vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="col-sm-5 card p-5 shadow w-50">
        <h3 class="text-center mb-3">Login</h3>
        <form>
          <!-- username -->
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              placeholder="Enter Username"
            />
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              type="email"
              class="form-control"
              placeholder="Enter Password"
            />
          </div>

          <!-- forgot password -->
          <div class="mb-3">
            <label class="form-label text-end w-100 link-primary text-decoration-underline"
              >Forgot Password</label
            >
          </div>
          <!-- Login -->
          <div class="d-grid mb-3">
            <button class="btn btn-success fw-bold" type="submit">Login</button>
          </div>
          <div>
            <label class="form-label text-center w-100"
              >Don't have an account? <u class="link-primary">Sign Up</u></label
            >
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
